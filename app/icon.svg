<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Mela Space">
  <defs>
    <linearGradient id="mela-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b291f" />
      <stop offset="100%" stop-color="#221610" />
    </linearGradient>
    <linearGradient id="mela-gold" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5e6d3" />
      <stop offset="100%" stop-color="#c9976b" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with subtle highlight border -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#mela-bg)" />
  <rect x="3" y="3" width="58" height="58" rx="16" stroke="#5a3f30" stroke-width="1.5" />

  <!-- Signature Mela Clarity Rings: concentric circles symbolizing focus, reflection, and inner calm -->
  <circle cx="32" cy="32" r="19" stroke="#967054" stroke-width="2.5" opacity="0.45" />
  <circle cx="32" cy="32" r="12" stroke="url(#mela-gold)" stroke-width="3" />
  <circle cx="32" cy="32" r="4.5" fill="#f5e6d3" />
</svg>
